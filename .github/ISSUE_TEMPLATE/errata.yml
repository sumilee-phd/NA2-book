name: 오류 제보
description: 교재 본문·연습 웹앱 4종의 오류 제보
title: "[오류] "
labels: ["오류 제보"]
body:
  - type: dropdown
    id: where
    attributes:
      label: 대상
      options:
        - 1권 필기
        - 2권 실기
        - 케이블링 트레이너
        - 윈도우 서버 설정 연습기
        - 단답형 타자 연습기
        - 라우터 타자 연습기
    validations:
      required: true
  - type: input
    id: position
    attributes:
      label: 쪽 번호와 위치
      description: 절 번호, 표·그림 번호, 문항 번호, 단계 번호
      placeholder: 예) 2권 98쪽, 18.2절 그림 18-8, 3단계
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: 잘못된 내용
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: 바른 내용과 근거
  - type: checkboxes
    id: rules
    attributes:
      label: 확인
      options:
        - label: 이름·연락처·수험번호 같은 개인정보를 적지 않았습니다
          required: true
        - label: 시험 문항의 원문·보기를 옮겨 적지 않았습니다
          required: true
